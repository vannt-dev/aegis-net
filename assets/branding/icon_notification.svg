<!--
  Icon thong bao Android (small icon). He thong CHI dung kenh alpha roi to lai
  theo mau cua no, nen hinh phai la silhouette trang + vung trong suot.

  Khac icon_monochrome.svg o hai diem, deu co chu y:
  - Khong co scale 0.93: ty le do ton tai de khop icon_foreground trong adaptive
    icon, khong lien quan gi den notification.
  - viewBox cat sat khien (297..727 x 205..781, tam 512,493) chu khong phai ca
    canvas 1024. Giu nguyen canvas thi khien chi chiem ~53% chieu cao, thu nho
    ve 24dp se thanh mot dom mo.

  Canh 654 = chieu cao khien 576 / 0.88, tuc chua le 6% moi phia -> phan ve nam
  gon trong vung 22x22dp ma Android khuyen nghi cho khung 24x24dp.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="185 166 654 654">
  <defs>
    <mask id="knockout">
      <path d="M 512 222 Q 636 222 690 254 Q 710 266 710 300 L 710 468 Q 710 604 598 700 Q 552 740 512 764 Q 472 740 426 700 Q 314 604 314 468 L 314 300 Q 314 266 334 254 Q 388 222 512 222 Z"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="34" stroke-linejoin="round"/>

      <g stroke="#000000" stroke-width="26" stroke-linecap="round">
        <line x1="512" y1="470" x2="512" y2="352"/>
        <line x1="512" y1="470" x2="410" y2="529"/>
        <line x1="512" y1="470" x2="614" y2="529"/>
      </g>
      <circle cx="512" cy="352" r="34" fill="#000000"/>
      <circle cx="410" cy="529" r="34" fill="#000000"/>
      <circle cx="614" cy="529" r="34" fill="#000000"/>
      <circle cx="512" cy="470" r="50" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="#FFFFFF" mask="url(#knockout)"/>
</svg>
