name: aegis_net
description: "AegisNet - High Performance System-wide DNS & Privacy Guard powered by Flutter and Rust Core."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.2
  provider: ^6.1.2
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Nguon icon nam o assets/branding/ (SVG + render.mjs). Sua thiet ke thi chay:
#   node assets/branding/render.mjs && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/generated/icon_full.png
  android: true
  adaptive_icon_foreground: assets/branding/generated/icon_foreground.png
  adaptive_icon_background: assets/branding/generated/icon_background.png
  adaptive_icon_monochrome: assets/branding/generated/icon_monochrome.png
  # Mac dinh package chen inset 16% vao foreground. SVG cua minh da tu ton trong
  # safe zone roi (xem spec 3.4), de nguyen 16% se bi thu nho hai lan -> icon te.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#0A0F14"
    theme_color: "#18FFFF"
