name: AegisNet iOS Build Verification

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ios-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  rust-ios-core:
    name: 🦀 Rust Core — iOS cross-compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/aegis_core"

      - name: Build libaegis_core.a (device + simulator)
        run: |
          cd rust/aegis_core
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios

      - name: Upload iOS static libraries
        uses: actions/upload-artifact@v4
        with:
          name: libaegis_core-ios
          path: |
            rust/aegis_core/target/aarch64-apple-ios/release/libaegis_core.a
            rust/aegis_core/target/aarch64-apple-ios-sim/release/libaegis_core.a
            rust/aegis_core/target/x86_64-apple-ios/release/libaegis_core.a
          if-no-files-found: error

  # Gating since the first green build. The Runner target compiles on a clean
  # checkout, so any regression here is a real break — the PacketTunnel target
  # is still absent (see CHANGELOG.md "Known follow-ups") but nothing in this
  # job depends on it.
  flutter-ios-app:
    name: 📱 Flutter iOS shell build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:-ios'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-ios'

      - name: Toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Dependencies
        run: flutter pub get

      # Runner.xcodeproj integrates plugins via Swift Package Manager, and the
      # package it points at (ios/Flutter/ephemeral/Packages) is generated, not
      # committed. If it is missing or empty here, Xcode fails with
      # "Missing package product 'FlutterGeneratedPluginSwiftPackage'" — so dump
      # it before the build to show which side is at fault.
      - name: Dump generated Swift package state
        run: |
          echo "=== enable-swift-package-manager ==="
          flutter config --list | grep swift-package-manager || true
          echo "=== ios/Flutter/ephemeral tree ==="
          find ios/Flutter/ephemeral -maxdepth 4 || echo "MISSING: ios/Flutter/ephemeral"
          echo "=== FlutterGeneratedPluginSwiftPackage/Package.swift ==="
          cat ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift \
            || echo "MISSING: generated Package.swift"

      - name: Build iOS shell
        run: flutter build ios --no-codesign
