name: AegisNet Fast CI/CD Pipeline

on:
  # Not main: the release PR already ran all of this on the same files (merging
  # develop into main changes nothing), and release.yml tests again before it
  # builds. develop stays: it is the default branch, the only one whose runs
  # write the Gradle cache, and it catches two merges that pass alone but not
  # together.
  push:
    branches: [develop]
  # No paths filter here: "CI result" is a required check, and a workflow that
  # does not start never reports it. Docs-only changes skip the jobs instead
  # (see `changes`).
  pull_request:
  # Cache Actions bị xoá sau 7 ngày không dùng, và gradle/actions/setup-gradle
  # chỉ GHI cache khi chạy trên default branch (trên PR nó là read-only). Không
  # có nhịp chạy trên main thì cache Gradle hết hạn và mọi PR build lạnh lại từ
  # đầu. Thứ 2 + thứ 5 giữ khoảng cách tối đa 4 ngày, an toàn dưới ngưỡng 7 ngày.
  schedule:
    - cron: '0 3 * * 1,4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        name: Files this change touches
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Only here to keep the Gradle cache warm; macOS has nothing to warm.
            { echo "code=true"; echo "ios=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "no base to compare with ($EVENT_NAME): full run"
            { echo "code=true"; echo "ios=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed"
          # Only these leave the app as it was.
          if echo "$changed" | grep -Evq '^(docs/|[^/]+\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # macOS runners are few and shared: iOS builds when the iOS project, the
          # engine, the plugins or CI change, and on every release PR into main.
          if [ "$BASE_REF" = "main" ] ||
             echo "$changed" | grep -Eq '^(ios/|rust/|pubspec\.(yaml|lock)$|\.github/)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  test-rust:
    name: 🦀 Rust Core Engine Check & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-core
        with:
          deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "rust/aegis_core"

      - name: Run Cargo Check & Unit Tests
        run: |
          cd rust/aegis_core
          cargo check
          cargo test --verbose

  test-flutter-web:
    name: 🌐 Flutter Web Test & Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:-web'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-web'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze & Unit Tests
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build Web Production Bundle
        run: flutter build web --release

  build-flutter-android:
    name: 📱 Flutter Android APK Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-core
        with:
          deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:-android'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-android'

      - uses: ./.github/actions/install-ndk

      - name: Install Dependencies
        run: flutter pub get

      # Job này chỉ là cổng kiểm tra biên dịch, APK ở đây không ai cài. Mặc định
      # `flutter build apk` đóng gói cả 3 ABI; bản phát hành thật do release.yml
      # dựng, ở đó có bước bắt buộc đủ 3 ABI nên giới hạn tại đây không đụng tới
      # artifact giao cho tester.
      - name: Build Android APK
        run: flutter build apk --debug --target-platform android-arm64

  # What someone outside sees: this repository and nothing else. The engine's
  # source is a private submodule they cannot fetch, so no deploy key here and
  # no Rust toolchain; the build has to take the engine a release already built
  # (fetchPrebuiltEngine in android/app/build.gradle.kts) and still produce an
  # APK that carries it. A pull request from a fork runs this job the same way.
  build-public-clone:
    name: 🌍 Android build from the public repository alone
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:-android'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-android'

      - uses: ./.github/actions/install-ndk

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: The APK carries the prebuilt engine
        run: |
          test ! -f rust/aegis_core/Cargo.toml
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/arm64-v8a/libaegis_core.so'

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios.yml
    secrets:
      CORE_DEPLOY_KEY: ${{ secrets.CORE_DEPLOY_KEY }}

  # The one check the rulesets require. Passes when every job above passed or was
  # skipped as not needed; fails on a failure or a cancellation, including a
  # macOS job that never got a runner (re-run it rather than merge around it).
  ci-result:
    name: CI result
    if: always()
    needs:
      [changes, test-rust, test-flutter-web, build-flutter-android, build-public-clone, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
