[package]
name = "aegis_core"
version = "0.1.0"
edition = "2021"
authors = ["AegisNet Team"]
description = "High-performance Rust engine for AegisNet DNS Filtering and Rule Matching"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
lazy_static = "1.4"
dashmap = "5.5"
jni = "0.21"
ureq = "2.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
