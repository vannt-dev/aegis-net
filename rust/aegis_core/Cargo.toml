[package]
name = "aegis_core"
version = "0.1.0"
edition = "2021"
authors = ["AegisNet Team"]
description = "High-performance Rust engine for AegisNet DNS Filtering and Rule Matching"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "2.0.0"
tokio = { version = "1.38", features = ["full"] }
aho-corasick = "1.1"
regex = "1.10"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
lazy_static = "1.4"
trust-dns-proto = "0.23" # DNS packet parsing
dashmap = "5.5" # Concurrent fast lookup
